      <circle cx="338" cy="290" r="16"/>
    </g>
    <path d="M62 130 L110 130" stroke="url(#ma-brand)" stroke-width="12"/>
    <path d="M338 290 L290 290" stroke="url(#ma-brand)" stroke-width="12"/>
    <!-- Anchor -->
    <g stroke="#12446E">
      <circle cx="200" cy="112" r="18" stroke-width="12"/>
      <line x1="200" y1="130" x2="200" y2="300" stroke-width="14"/>
      <line x1="152" y1="158" x2="248" y2="158" stroke-width="13"/>
      <path d="M132 250 C136 312 200 322 200 322 C200 322 264 312 268 250" stroke-width="14"/>
      <path d="M132 250 L118 236 M132 250 L150 236" stroke-width="11"/>
      <path d="M268 250 L282 236 M268 250 L250 236" stroke-width="11"/>
    </g>
    <!-- Upward growth arrow -->
    <g stroke="url(#ma-brand)">
      <line x1="120" y1="300" x2="292" y2="108" stroke-width="15"/>
      <path d="M292 108 L246 116 M292 108 L286 158" stroke-width="15"/>
    </g>
