<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 400 400" role="img" aria-label="Make-Algo">
  <title>Make-Algo — emblema</title>
  <defs>
    <linearGradient id="ma-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E77C4"/>
      <stop offset="0.55" stop-color="#2AA6A6"/>
      <stop offset="1" stop-color="#43C08A"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hexagon frame -->
    <path d="M200 40 L338 130 L338 290 L200 380 L62 290 L62 130 Z"
